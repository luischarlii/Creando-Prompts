<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Prompts">
<link rel="manifest" href="manifest.json">
<title>Mis Prompts</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#111;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 16px 32px}
header{padding:24px 4px 14px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:32px;margin:0}.sub{color:#6e6e73;margin-top:4px}
button,input,textarea,select{font:inherit}button{border:0;border-radius:14px;padding:12px 15px;font-weight:600;cursor:pointer}
.primary{background:#111;color:#fff}.search{width:100%;padding:14px 16px;border:1px solid #ddd;border-radius:16px;background:white;margin:8px 0 14px}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.chip{white-space:nowrap;background:white;border:1px solid #ddd;padding:9px 12px;border-radius:999px}.chip.active{background:#111;color:#fff}
.card{background:#fff;border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 1px 4px #00000010}.card h3{margin:0 0 6px}.meta{font-size:13px;color:#6e6e73;margin-bottom:10px}.prompt{white-space:pre-wrap;line-height:1.4;color:#333;max-height:120px;overflow:hidden}.actions{display:flex;gap:8px;margin-top:12px}.actions button{background:#f0f0f2}.actions .copy{background:#111;color:#fff}
dialog{border:0;border-radius:24px;width:min(92%,600px);padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0008}.modal{padding:20px}.modal h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fafafa}.field textarea{min-height:180px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1}
.empty{text-align:center;color:#6e6e73;padding:50px 10px}.count{font-size:13px;color:#6e6e73}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Mis Prompts</h1><div class="sub">Tu biblioteca personal de IA</div></div><button class="primary" onclick="openNew()">＋ Nuevo</button></header>
<input id="search" class="search" placeholder="🔎 Buscar prompts..." oninput="render()">
<div id="chips" class="chips"></div>
<div class="count" id="count"></div>
<div id="list"></div>
</div>

<dialog id="dlg">
<div class="modal">
<h2 id="dlgTitle">Nuevo prompt</h2>
<div class="field"><label>Título</label><input id="title" placeholder="Ej. Vaquero cinematográfico"></div>
<div class="row">
<div class="field"><label>Categoría</label><select id="category"></select></div>
<div class="field"><label>Modelo</label><select id="model"><option>Seedream 4.5</option><option>CapCut</option><option>Otro</option></select></div>
</div>
<div class="field"><label>Formato</label><select id="ratio"><option>9:16</option><option>3:4</option><option>16:9</option><option>1:1</option><option>Otro</option></select></div>
<div class="field"><label>Prompt</label><textarea id="prompt" placeholder="Escribe aquí tu prompt..."></textarea></div>
<div class="actions"><button onclick="closeDlg()">Cancelar</button><button class="primary" onclick="savePrompt()">Guardar</button></div>
</div>
</dialog>

<script>
const cats=["Todos","CapCut","Seedream","Imágenes","Video","México","Vaquero","Religioso","Ideas"];
let data=JSON.parse(localStorage.getItem("misPrompts")||"[]"), editing=null, active="Todos";
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function init(){
 $("category").innerHTML=cats.slice(1).map(c=>`<option>${c}</option>`).join("");
 $("chips").innerHTML=cats.map(c=>`<button class="chip ${c==="Todos"?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
 render();
}
function setCat(c){active=c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.textContent===c));render()}
function render(){
 const q=$("search").value.toLowerCase();
 let arr=data.filter(x=>(active==="Todos"||x.category===active)&&(`${x.title} ${x.prompt} ${x.model} ${x.category}`).toLowerCase().includes(q));
 $("count").textContent=`${arr.length} prompt${arr.length===1?"":"s"}`;
 $("list").innerHTML=arr.length?arr.map(x=>`
 <article class="card">
 <h3>${esc(x.favorite?"⭐ ":"")}${esc(x.title)}</h3>
 <div class="meta">${esc(x.category)} · ${esc(x.model)} · ${esc(x.ratio)}</div>
 <div class="prompt">${esc(x.prompt)}</div>
 <div class="actions"><button class="copy" onclick="copyPrompt('${x.id}')">Copiar</button><button onclick="editPrompt('${x.id}')">Editar</button><button onclick="toggleFav('${x.id}')">${x.favorite?"★":"☆"}</button><button onclick="delPrompt('${x.id}')">Eliminar</button></div>
 </article>`).join(""):`<div class="empty">No hay prompts todavía.<br><br>Pulsa <b>＋ Nuevo</b> para guardar el primero.</div>`;
}
function openNew(){editing=null;$("dlgTitle").textContent="Nuevo prompt";$("title").value="";$("prompt").value="";$("category").value="Ideas";$("model").value="Seedream 4.5";$("ratio").value="9:16";$("dlg").showModal()}
function editPrompt(id){let x=data.find(a=>a.id===id);editing=id;$("dlgTitle").textContent="Editar prompt";$("title").value=x.title;$("prompt").value=x.prompt;$("category").value=x.category;$("model").value=x.model;$("ratio").value=x.ratio;$("dlg").showModal()}
function savePrompt(){
 let obj={id:editing||crypto.randomUUID(),title:$("title").value.trim()||"Sin título",prompt:$("prompt").value.trim(),category:$("category").value,model:$("model").value,ratio:$("ratio").value,favorite:editing?(data.find(x=>x.id===editing)?.favorite||false):false};
 if(editing)data=data.map(x=>x.id===editing?obj:x);else data.unshift(obj);
 localStorage.setItem("misPrompts",JSON.stringify(data));closeDlg();render()
}
function closeDlg(){$("dlg").close()}
async function copyPrompt(id){let x=data.find(a=>a.id===id);await navigator.clipboard.writeText(x.prompt);alert("Prompt copiado")}
function toggleFav(id){data=data.map(x=>x.id===id?{...x,favorite:!x.favorite}:x);localStorage.setItem("misPrompts",JSON.stringify(data));render()}
function delPrompt(id){if(confirm("¿Eliminar este prompt?")){data=data.filter(x=>x.id!==id);localStorage.setItem("misPrompts",JSON.stringify(data));render()}}
init();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
